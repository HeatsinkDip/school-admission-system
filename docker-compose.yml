services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_pass}
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-school_admin} -d $${POSTGRES_DB:-school_admission}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-Host=db;Port=5432;Database=school_admission;Username=school_admin;Password=school_pass}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-3}
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "3000:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend

  # Bonus: second backend process sharing the same PostgreSQL database (`docker compose --profile multi up --build`)
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8081:8080"
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-Host=db;Port=5432;Database=school_admission;Username=school_admin;Password=school_pass}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-3}
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - multi

  # Automated test runners (`docker compose --profile test run --rm backend-tests` / `frontend-tests`)
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      TEST_DB_CONNECTION: ${TEST_DB_CONNECTION:-Host=db;Port=5432;Database=school_admission_test;Username=school_admin;Password=school_pass}
      HOLD_DURATION_SECONDS: "600"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    profiles:
      - test

volumes:
  pgdata:

