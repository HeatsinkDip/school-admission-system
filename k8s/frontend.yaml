apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-admission-frontend
  namespace: school-admission
  labels:
    app.kubernetes.io/name: school-admission-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: onnorokom-projukti-school
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: school-admission-frontend
  template:
    metadata:
      labels:
        app: school-admission-frontend
    spec:
      containers:
        - name: frontend
          image: school-admission-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: school-admission-config
                  key: API_BASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: school-admission
  labels:
    app.kubernetes.io/name: school-admission-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: school-admission-frontend

