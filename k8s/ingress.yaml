apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school-admission-ingress
  namespace: school-admission
  labels:
    app.kubernetes.io/name: school-admission-system
    app.kubernetes.io/part-of: onnorokom-projukti-school
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: school.local
      http:
        paths:
          # Backend API routes
          - path: /classes
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /holds
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /me
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Frontend SPA fallback
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

